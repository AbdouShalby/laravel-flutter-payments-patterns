name: CI

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Fresh Laravel app + api/ + tests
        run: ./scripts/bootstrap-test-app.sh "$RUNNER_TEMP/payments-app"
